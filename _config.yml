# ==============================================================================
# 🚀 Hexo Theme Chirpy Classic - Configuration File (_config.yml)
# Complies with Hexo Theme Schema protocol for Hexo CMS visual settings panel.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Basic Information & Profile (Values override站点 global config if provided)
# ------------------------------------------------------------------------------
title: ""                            # Site Title (Fallbacks to config.title if empty)
subtitle: "Sharing thoughts and knowledge" # Subtitle / Motto
description: ""                     # Site Description / SEO Meta (Fallbacks to config.description)
author: "Your Name"                 # Author Name (Fallbacks to config.author)
avatar: "/images/avatar.jpg"        # Sidebar Avatar Path or URL
favicon: "/favicon.ico"             # Favicon Path
language: ""                        # Language (e.g. en, zh-CN, Fallbacks to config.language)
timezone: ""                        # Timezone (e.g. Asia/Shanghai)
url: ""                             # Blog Base URL

# ------------------------------------------------------------------------------
# 2. Appearance & Presets
# ------------------------------------------------------------------------------
style_preset: "chirpy"               # Preset style theme (e.g. chirpy, bento, brutalism, shadcn...)
color_scheme: "auto"                 # Scheme mode: auto / light / dark
accent_color: "#7952b3"              # Accent Highlight Color (Hex code)

# ------------------------------------------------------------------------------
# 3. Features & Pagination Settings
# ------------------------------------------------------------------------------
toc_enabled: true                   # Enable table of contents on post pages
reading_progress: true              # Enable top scroll reading progress bar
code_copy: true                     # Enable code block copy button

pagination:
  per_page: 6                       # Posts per page (Recommended 6-12)
  prev_text: "Previous"             # Label for 'Previous Page' button
  next_text: "Next"                 # Label for 'Next Page' button

# ------------------------------------------------------------------------------
# 4. Social Links (Icons displayed at sidebar bottom when configured)
# ------------------------------------------------------------------------------
social:
  github: "https://github.com"      # GitHub Profile URL
  rss: "/atom.xml"                  # RSS Feed Path
  email: ""                         # Email Address
  qq: ""                            # QQ Contact
  wechat: ""                        # WeChat ID or QR Code Image URL

# ------------------------------------------------------------------------------
# 5. About Page Configuration
# ------------------------------------------------------------------------------
about:
  role: "Developer / Creator"         # Role / Profession Tag
  skills: []                          # Skill Badges, e.g. ["JavaScript", "Node.js", "Vue", "Hexo"]
  description: "Welcome to my blog! Here I share my technical explorations, code snippets, and daily thoughts."

# ------------------------------------------------------------------------------
# 6. Friends Page Configuration
# ------------------------------------------------------------------------------
links_apply_tip: |
  Welcome to exchange friend links! Please leave a message or apply using the format below:
  - **Site Name**: My Blog
  - **Site URL**: https://yourdomain.com
  - **Avatar URL**: https://yourdomain.com/avatar.jpg
  - **Description**: Sharing technology and life

friends: []                         # Friends list

# ------------------------------------------------------------------------------
# 7. Comments Configuration
# ------------------------------------------------------------------------------
comments_enabled: false             # Enable comments
comments_provider: "waline"         # Comments provider: waline / giscus / disqus
waline_server_url: ""               # Waline Server URL
giscus_repo: ""                     # Giscus Repo (e.g. owner/repo)
disqus_shortname: ""                # Disqus Shortname

# ------------------------------------------------------------------------------
# 8. Custom Code Injection
# ------------------------------------------------------------------------------
head_code: ""                       # Code injected into <head>
footer_code: ""                     # Code injected before </body>
