schema_version: "1.0"

meta:
  name: "chirpy"
  display_name: "Chirpy Classic (English)"
  description: "A clean, elegant, and feature-rich Hexo technical blog theme (Zero-config out of the box, with auto routing & Mermaid rendering)."
  version: "2.0.0"
  author: "Hexo CMS Team"
  homepage: "https://github.com/base404/hexo-theme-chirpy"
  tags: ["Three-column", "Dark Mode", "TOC", "Responsive", "Code Copy", "Progress Bar", "Friends", "About Page", "Comments"]

groups:
  - id: "basic"
    label: "Basic Information & Profile"
    icon: "globe"
    fields:
      - name: "title"
        label: "Site Main Title (title)"
        type: "text"
        description: "Title displayed in browser tabs and header (Fallbacks to global config.title if empty)"
        default: ""

      - name: "subtitle"
        label: "Subtitle / Motto (subtitle)"
        type: "text"
        description: "Italic tagline under sidebar avatar (Fallbacks to global config.subtitle if empty)"
        default: "Sharing thoughts and knowledge"

      - name: "description"
        label: "Site Description (description)"
        type: "textarea"
        description: "Global SEO description for search engines (Fallbacks to global config.description if empty)"
        default: ""

      - name: "author"
        label: "Author Name (author)"
        type: "text"
        description: "Blogger name shown in sidebar (Fallbacks to global config.author if empty)"
        default: ""

      - name: "avatar"
        label: "Sidebar Avatar Path / URL (avatar)"
        type: "text"
        description: "Relative image path under theme or external image URL"
        default: "/images/avatar.jpg"

      - name: "favicon"
        label: "Site Favicon (favicon)"
        type: "text"
        description: "Browser tab icon path"
        default: "/favicon.ico"

      - name: "language"
        label: "Site Language (language)"
        type: "select"
        description: "HTML lang attribute & UI locale (Fallbacks to global config.language if empty)"
        default: ""
        options:
          - value: ""
            label: "Default (Inherit global site config)"
          - value: "en"
            label: "English (en)"
          - value: "zh-CN"
            label: "Simplified Chinese (zh-CN)"
          - value: "zh-TW"
            label: "Traditional Chinese (zh-TW)"

      - name: "timezone"
        label: "Timezone (timezone)"
        type: "text"
        description: "e.g., Asia/Shanghai or UTC (Fallbacks to global config.timezone if empty)"
        default: ""

      - name: "url"
        label: "Blog Base URL (url)"
        type: "text"
        description: "e.g., https://yourdomain.com (Fallbacks to global config.url if empty)"
        default: ""

  - id: "social"
    label: "Sidebar Social Links"
    icon: "share-2"
    fields:
      - name: "social.github"
        label: "GitHub Profile URL"
        type: "text"
        description: "e.g., https://github.com/your-username (Leave empty to hide icon)"
        default: "https://github.com"

      - name: "social.rss"
        label: "RSS Feed Path"
        type: "text"
        description: "e.g., /atom.xml (Leave empty to hide icon)"
        default: "/atom.xml"

      - name: "social.email"
        label: "Email Address"
        type: "text"
        description: "e.g., mailto:your_name@example.com (Leave empty to hide icon)"
        default: ""

      - name: "social.qq"
        label: "QQ Contact"
        type: "text"
        description: "e.g., 123456789 (Leave empty to hide icon)"
        default: ""

      - name: "social.wechat"
        label: "WeChat ID / QR Code Path"
        type: "text"
        description: "e.g., /images/wechat_qr.png (Leave empty to hide icon)"
        default: ""

  - id: "pagination"
    label: "Post List & Pagination"
    icon: "list"
    fields:
      - name: "pagination.per_page"
        label: "Posts Per Page (per_page)"
        type: "number"
        description: "Number of post cards displayed per page in homepage, archive, category, and tag pages"
        default: 6
        min: 1
        max: 50

      - name: "pagination.prev_text"
        label: "Previous Page Button Text"
        type: "text"
        description: "Custom label text for the previous page button"
        default: "Previous"

      - name: "pagination.next_text"
        label: "Next Page Button Text"
        type: "text"
        description: "Custom label text for the next page button"
        default: "Next"

  - id: "about"
    label: "About Page Configuration"
    icon: "globe"
    fields:
      - name: "about.name"
        label: "Custom Name (Optional override)"
        type: "text"
        description: "Leave empty to reuse author from basic settings"
        default: ""

      - name: "about.avatar"
        label: "Custom Avatar Path (Optional override)"
        type: "text"
        description: "e.g., /images/avatar.jpg (Leave empty to reuse sidebar avatar)"
        default: ""

      - name: "about.bio"
        label: "Custom Bio (Optional override)"
        type: "text"
        description: "Leave empty to reuse subtitle from basic settings"
        default: ""

      - name: "about.role"
        label: "Role / Profession Tag"
        type: "text"
        default: "Developer / Creator"

      - name: "about.skills"
        label: "Skills / Tech Stack Tags"
        type: "tags"
        description: "List of skill pill tags displayed on the About page"
        default: []

      - name: "about.description"
        label: "About Page Content (Markdown)"
        type: "textarea"
        description: "Markdown format content for personal background, skills, and intro"
        default: "Welcome to my blog! Here I share my technical explorations, code snippets, and daily thoughts."

  - id: "links"
    label: "Friends Links Page"
    icon: "globe"
    fields:
      - name: "links_apply_tip"
        label: "Friend Link Application Guidelines (Markdown)"
        type: "textarea"
        description: "Instructional notice displayed beneath friend link cards"
        default: |
          Welcome to exchange friend links! Please leave a message or apply using the format below:
          - **Site Name**: My Blog
          - **Site URL**: https://yourdomain.com
          - **Avatar URL**: https://yourdomain.com/avatar.jpg
          - **Description**: Sharing technology and life

      - name: "friends"
        label: "Friend Links List"
        type: "array"
        description: "Manage friend link items (add, edit, or delete name, URL, avatar, and description)"
        default:
          - name: "Hexo Official Docs"
            url: "https://hexo.io"
            avatar: "https://hexo.io/icon/favicon-192x192.png"
            desc: "A fast, simple & powerful blog framework powered by Node.js."
          - name: "AirboZH's Blog"
            url: "https://www.airbozh.cn"
            avatar: "https://www.airbozh.cn/images/avatar.png"
            desc: "Original author of Chirpy theme and web dev sharing."
          - name: "GitHub"
            url: "https://github.com"
            avatar: "https://github.githubassets.com/favicons/favicon.svg"
            desc: "Where the world builds software."

  - id: "style"
    label: "Appearance & Presets"
    icon: "palette"
    fields:
      - name: "style_preset"
        label: "Theme Design Preset"
        type: "select"
        description: "Curated color preset schemes inspired by awesome-design-skills"
        default: "chirpy"
        options:
          - value: "chirpy"
            label: "Chirpy Classic (Dark Slate + Purple Accent)"
          - value: "agentic"
            label: "Agentic (Conversational AI Interface)"
          - value: "bento"
            label: "Bento (Modular Bento Grid Layout)"
          - value: "brutalism"
            label: "Brutalism (Bold Anti-design Aesthetics)"
          - value: "matrix"
            label: "Matrix (Hacker Green Monospace)"
          - value: "paper"
            label: "Paper (Retro Parchment Texture)"
          - value: "glassmorphism"
            label: "Glassmorphism (Frosted Glass Blur)"

      - name: "color_scheme"
        label: "Color Scheme Mode"
        type: "select"
        description: "Control initial color scheme mode"
        default: "auto"
        options:
          - value: "auto"
            label: "Follow System Preference (Auto)"
          - value: "light"
            label: "Light Mode (Light)"
          - value: "dark"
            label: "Dark Mode (Dark)"

      - name: "accent_color"
        label: "Accent Highlight Color"
        type: "color"
        description: "Brand accent color for links, buttons, and active indicators"
        default: "#7952b3"

  - id: "features"
    label: "Interactive Feature Switches"
    icon: "sliders"
    fields:
      - name: "toc_enabled"
        label: "Post Floating Table of Contents (TOC)"
        type: "switch"
        description: "Display a hierarchical floating table of contents on post pages"
        default: true

      - name: "reading_progress"
        label: "Reading Progress Bar"
        type: "switch"
        description: "Display a top scroll reading progress percentage bar"
        default: true

      - name: "code_copy"
        label: "Code Block One-Click Copy Button"
        type: "switch"
        description: "Generate copy icon at top right corner of code highlight blocks"
        default: true

      - name: "per_page"
        label: "Homepage Posts Per Page"
        type: "number"
        default: 10
        min: 1
        max: 50

  - id: "comments"
    label: "Comments System"
    icon: "message-square"
    fields:
      - name: "comments_enabled"
        label: "Enable Comments Section"
        type: "switch"
        description: "Show comment box at bottom of posts, friends, and about pages"
        default: false

      - name: "comments_provider"
        label: "Comment Provider"
        type: "select"
        default: "waline"
        options:
          - value: "waline"
            label: "Waline (Recommended: Lightweight & feature-rich)"
          - value: "giscus"
            label: "Giscus (GitHub Discussions)"
          - value: "disqus"
            label: "Disqus"

      - name: "waline_server_url"
        label: "Waline Server Domain URL"
        type: "text"
        description: "Root domain URL of your Waline deployment (e.g., https://blog-waline...vercel.app)"
        default: ""

      - name: "disqus_shortname"
        label: "Disqus Shortname"
        type: "text"
        default: ""

      - name: "giscus_repo"
        label: "Giscus Repository (owner/repo)"
        type: "text"
        default: ""

  - id: "custom_code"
    label: "Custom Code Injection"
    icon: "code"
    fields:
      - name: "head_code"
        label: "<head> Code Injection"
        type: "code"
        language: "html"
        description: "Custom analytics scripts or CSS styles injected into <head>"
        default: ""

      - name: "footer_code"
        label: "Footer </body> Code Injection"
        type: "code"
        language: "html"
        description: "Custom JS extensions injected before </body> tag"
        default: ""
